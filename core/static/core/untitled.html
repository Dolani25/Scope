        <style>
            
            

body {
    margin: 0;
    padding: 0;
    font-family: sans-serif;
    background: black;
    color: white;
    min-height: 90vh;
    display: flex;
    justify-content: center;
}

main {
    width: 100%;
    max-width: 640px;
    height: 100%;
}

.color-secondary {
    color: #F27438;
}

.item-week {
    display: flex;
    align-items: center;
    justify-content: center;
}

.item-day {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    border-top: solid 1px rgba(255, 255, 255, 0.3);
    padding: 0.6rem 0;
}

.item-day .isWeekend {
    color: gray;
}

.item-day .current {
    color: rgb(255, 155, 155);
}

.item-day.empty {
    border: none;
}

.dot {
    width: 0.5rem;
    height: 0.5rem;
    border-radius: 100%;
    margin: 0.2rem 0;
    opacity: 0;
    background: #F27438;
}

.item-day.active .dot {
    opacity: 1;
}

            
            
        </style>
    </head>
