{% extends 'base.html' %}

{% block content %}
  <h1>Event Calendar</h1>
  <form>
    <select name="year">
      {% for year in range|year_range %}
        <option value="{{ year }}" {% if year == calendar_year %}selected{% endif %}>{{ year }}</option>
      {% endfor %}
    </select>
    <select name="month">
      {% for month in range|month_range %}
        <option value="{{ month }}" {% if month == calendar_month %}selected{% endif %}>{{ month }}</option>
      {% endfor %}
    </select>
    <button type="submit">Go</button>
  </form>
  {{ calendar|safe }}
  <ul>
    {% for event in events %}
      <li>
        {{ event.start_date }} - {{ event.title }}
      </li>
    {% endfor %}
  </ul>
{% endblock %}
